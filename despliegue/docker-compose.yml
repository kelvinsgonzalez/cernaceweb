# Despliegue completo en un solo servidor: Postgres, la aplicación y Caddy
# (que obtiene y renueva solo el certificado HTTPS de Let's Encrypt).
#
#   cp .env.ejemplo .env   # y rellenar
#   docker compose up -d --build
#
# Los datos viven en volúmenes con nombre: reconstruir o borrar los contenedores
# no toca la base ni las fotos.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cernace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: cernace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cernace -d cernace"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cernace:${POSTGRES_PASSWORD}@db:5432/cernace?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Falta AUTH_SECRET en .env}
      AUTH_TRUST_HOST: "true"
      ALMACENAMIENTO_DIR: /datos/almacenamiento
    volumes:
      - almacenamiento:/datos/almacenamiento

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  almacenamiento:
  caddy_data:
  caddy_config:
